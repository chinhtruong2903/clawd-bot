version: "3.8"

services:
  backend:
    image: ${IMAGE_REF}
    container_name: ${CONTAINER_NAME:-clawbot-backend-dev}
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file:
      - .runtime.env
    environment:
      PORT: ${CONTAINER_PORT:-5000}
      CLAWBOT_ROOT: ${HOST_RUNTIME_DIR}
      OPENCLAW_IMAGE: ${OPENCLAW_IMAGE}
      OPENCLAW_GATEWAY_HOST: ${OPENCLAW_GATEWAY_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8600}:${CONTAINER_PORT:-5000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_RUNTIME_DIR}:${HOST_RUNTIME_DIR}
